zerops:
  - setup: api
    build:
      base: python@3.11
      buildCommands:
        - pip install --target=backend/deps -r backend/requirements.txt
      deployFiles:
        - backend
    run:
      base: python@3.11
      ports:
        - port: 8000
          httpSupport: true
      envVariables:
        DATABASE_URL: ${db_connectionString}
        CLAUDE_MODEL: claude-sonnet-4-6
        PYTHONPATH: /var/www/backend/deps
      start: bash -c "cd backend && python -m uvicorn main:app --host 0.0.0.0 --port 8000"

  - setup: web
    build:
      base: nodejs@20
      buildCommands:
        - rm -rf frontend/.next && cd frontend && npm install --legacy-peer-deps && npm run build
      deployFiles:
        - frontend/.next
        - frontend/package.json
        - frontend/next.config.js
        - frontend/node_modules
    run:
      base: nodejs@20
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NEXT_PUBLIC_API_URL: https://api-2e3e-8000.prg1.zerops.app
      start: bash -c "cd frontend && npm run start"