zerops:
  - setup: api
    build:
      base: python@3.11
      buildCommands:
        - pip install -r backend/requirements.txt
      deployFiles:
        - backend
    run:
      base: python@3.11
      ports:
        - port: 8000
          httpSupport: true
      envVariables:
        DATABASE_URL: ${db_connectionString}
        CLAUDE_MODEL: claude-sonnet-4-6
      start: uvicorn main:app --host 0.0.0.0 --port 8000
      workingDir: backend

  - setup: web
    build:
      base: nodejs@20
      workingDir: frontend
      buildCommands:
        - npm install --legacy-peer-deps
        - npm run build
      deployFiles:
        - .next
        - public
        - package.json
        - next.config.js
        - node_modules
    run:
      base: nodejs@20
      workingDir: frontend
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NEXT_PUBLIC_API_URL: ${api_zeropsSubdomain}
      start: npm run start